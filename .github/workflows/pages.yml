name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ans/**/*.md'
      - 'probrems/**/*.md'
      - 'site/**'
      - 'scripts/validate-katex.mjs'
      - 'scripts/prepare-pages-math.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install KaTeX
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Normalize source math delimiters
        run: npm run normalize:math

      - name: Commit normalized Markdown sources
        run: |
          if git diff --quiet -- ans probrems; then
            echo 'Math delimiters already normalized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ans probrems
            git commit -m 'chore: normalize math delimiters for KaTeX'
            git push origin HEAD:main
          fi

      - name: Reject legacy math delimiters
        run: npm run check:math-delimiters

      - name: Validate Markdown math with KaTeX
        run: npm run validate:katex

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp -R ans _site/ans
          cp -R probrems _site/probrems

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
