name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ans/**/*.md'
      - 'probrems/**/*.md'
      - 'site/**'
      - 'scripts/validate-katex.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install KaTeX
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Markdown math with KaTeX
        run: npm run validate:katex

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp -R ans _site/ans
          cp -R probrems _site/probrems

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
