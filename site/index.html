<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="早稲田大学 商学部 数学 過去問 2001〜2026年の問題・解答解説" />
  <title>早稲田大学 商学部 数学 過去問 解答解説</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css" />
  <style>
    .markdown-section {
      max-width: 980px;
    }
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.25rem 0;
    }
    .sidebar ul li a {
      white-space: normal;
    }
    .solution-details {
      margin: 1.25rem 0 2rem;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      background: #fff;
    }
    .solution-details > summary {
      cursor: pointer;
      padding: 0.85rem 1rem;
      font-weight: 700;
      user-select: none;
    }
    .solution-details[open] > summary {
      border-bottom: 1px solid #d8dee4;
    }
    .solution-body {
      padding: 0.25rem 1rem 1rem;
    }
    .solution-body > :first-child {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div id="app">読み込み中...</div>

  <script>
    function collapseSolutionSections(hook) {
      hook.doneEach(function () {
        if (!window.location.hash.startsWith('#/ans/')) return;

        const root = document.querySelector('.markdown-section');
        if (!root) return;

        const solutionHeadings = Array.from(root.querySelectorAll('h3')).filter(function (heading) {
          const text = heading.textContent.trim();
          return /(?:^|\s)解答(?:解説|・解説)?$/.test(text);
        });

        solutionHeadings.forEach(function (heading) {
          if (heading.closest('.solution-details')) return;

          const title = heading.textContent.trim();
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          const body = document.createElement('div');

          details.className = 'solution-details';
          body.className = 'solution-body';
          summary.textContent = title + 'を見る';

          details.addEventListener('toggle', function () {
            summary.textContent = title + (details.open ? 'を閉じる' : 'を見る');
          });

          const parent = heading.parentNode;
          let node = heading.nextSibling;

          parent.insertBefore(details, heading);
          details.appendChild(summary);
          details.appendChild(body);
          heading.remove();

          while (node) {
            const next = node.nextSibling;
            if (node.nodeType === Node.ELEMENT_NODE && /^(H2|H3)$/.test(node.tagName)) {
              break;
            }
            body.appendChild(node);
            node = next;
          }
        });
      });
    }

    window.$docsify = {
      name: '早稲田商学部 数学',
      repo: 'https://github.com/InSuns21/waseda_shogakubu_math',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      plugins: [collapseSolutionSections],
      search: {
        placeholder: 'サイト内検索',
        noData: '該当するページがありません',
        depth: 4
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@2.0.2/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
